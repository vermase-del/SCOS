spring:
  application:
    name: scos-core-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: 8080
  servlet:
    context-path: /

# JWT Token Configuration
scos:
  jwt:
    secret: ${SCOS_JWT_SECRET:}
    expiration-ms: ${SCOS_JWT_EXPIRATION_MS:86400000} # 24 hours
  seed:
    sample-data: false

# OpenAPI Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
