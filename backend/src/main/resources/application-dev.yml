spring:
  datasource:
    url: jdbc:h2:file:./data/scos_dev_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  flyway:
    enabled: false

scos:
  jwt:
    secret: ${SCOS_JWT_SECRET:scos_dev_local_only_jwt_secret_key_minimum_256_bits_length_for_scos_development_env_only!}
  seed:
    sample-data: true

logging:
  level:
    com.scos: INFO
    org.springframework.security: WARN
