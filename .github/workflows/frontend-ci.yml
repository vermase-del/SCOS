name: SCOS Frontend CI/CD Pipeline

permissions:
  contents: write

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'

env:
  NODE_VERSION: '20'
  DOCKER_IMAGE_NAME: 'scos/scos-web-frontend'

jobs:
  build-and-test:
    name: Build, Lint & Angular Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Regenerate lockfile using CI npm version
        working-directory: ./frontend
        run: npm install --package-lock-only --ignore-scripts

      - name: Upload normalized package lock
        uses: actions/upload-artifact@v4
        with:
          name: normalized-package-lock
          path: frontend/package-lock.json
          retention-days: 1

      - name: Commit normalized lockfile to the feature branch
        if: github.event_name == 'pull_request'
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          cp frontend/package-lock.json /tmp/scos-package-lock.json
          git fetch origin "$TARGET_BRANCH"
          git checkout "$TARGET_BRANCH"
          cp /tmp/scos-package-lock.json frontend/package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(frontend): synchronize npm lockfile"
            git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          fi

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint Code
        working-directory: ./frontend
        run: npm run lint --if-present

      - name: Production Build
        working-directory: ./frontend
        run: npm run build -- --configuration=production

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: scos-frontend-dist
          path: frontend/dist/
          retention-days: 7

  docker-build:
    name: Build & Package Frontend Nginx Container
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./docker/Dockerfile.frontend
          push: false
          tags: ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}, ${{ env.DOCKER_IMAGE_NAME }}:latest
