spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/scos_db}
    username: ${SPRING_DATASOURCE_USERNAME:scos_app_user}
    password: ${SPRING_DATASOURCE_PASSWORD:scos_secure_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

scos:
  jwt:
    secret: ${SCOS_JWT_SECRET}
    expiration-ms: ${SCOS_JWT_EXPIRATION_MS:86400000}

logging:
  level:
    com.scos: INFO
    root: WARN
