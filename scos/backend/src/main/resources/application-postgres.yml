spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/scos?options=-c%20timezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:platformadmin}
    password: ${SPRING_DATASOURCE_PASSWORD:iVZff2mxuHw+jEc0cg5J0k5ryB4+Nzpo9u2g2p3BT5s=}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

logging:
  level:
    com.scos: INFO
    org.flywaydb: INFO
