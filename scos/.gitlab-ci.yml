stages:
  - lint
  - build
  - test
  - package
  - deploy

variables:
  MAVEN_OPTS: "-Dhttps.protocols=TLSv1.2 -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN"
  DOCKER_DRIVER: overlay2

cache:
  paths:
    - .m2/repository
    - frontend/node_modules/

# ----------------- Backend Jobs -----------------
backend:compile:
  stage: build
  image: maven:3.9.6-eclipse-temurin-21
  script:
    - cd backend
    - mvn clean compile
  artifacts:
    paths:
      - backend/target/classes/
    expire_in: 1 day

backend:test:
  stage: test
  image: maven:3.9.6-eclipse-temurin-21
  services:
    - postgres:16-alpine
  variables:
    POSTGRES_DB: scos_db_test
    POSTGRES_USER: scos_user
    POSTGRES_PASSWORD: scos_password
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/scos_db_test
  script:
    - cd backend
    - mvn test
  artifacts:
    reports:
      junit:
        - backend/target/surefire-reports/TEST-*.xml

backend:package:
  stage: package
  image: maven:3.9.6-eclipse-temurin-21
  script:
    - cd backend
    - mvn package -DskipTests
  artifacts:
    paths:
      - backend/target/*.jar
    expire_in: 7 days
  only:
    - main
    - develop

# ----------------- Frontend Jobs -----------------
frontend:build:
  stage: build
  image: node:20-alpine
  script:
    - cd frontend
    - npm ci
    - npm run build -- --configuration=production
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 7 days

# ----------------- Docker Deployment -----------------
docker:compose-validate:
  stage: package
  image: docker:24.0.5
  services:
    - docker:dind
  script:
    - docker compose -f docker/docker-compose.yml config
